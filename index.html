<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#dff4e8">
    <title>ประวัติส่วนตัว | น้องแพง</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <div class="sparkle sparkle-one" aria-hidden="true">✳</div>
        <div class="sparkle sparkle-two" aria-hidden="true">✦</div>

        <article class="profile">
            <div class="photo-column">
                <p class="eyebrow">A LITTLE INTRODUCTION</p>
                <div class="photo-frame">
                    <img src="assets/nong-paeng.jpg" alt="รูปประจำตัวของน้องแพง">
                    <span class="photo-sticker" aria-hidden="true">♡</span>
                </div>
                <p class="photo-caption">ยินดีที่ได้รู้จักนะ!</p>
            </div>

            <div class="profile-content">
                <p class="hello">สวัสดีค่ะ <span aria-hidden="true">☀</span></p>
                <h1>น้องแพง</h1>
                <p class="intro">นี่คือพื้นที่เล็ก ๆ สำหรับแนะนำตัว<br class="desktop-break"> และเก็บเรื่องราวที่ชอบเอาไว้</p>

                <section class="details" aria-labelledby="about-title">
                    <h2 id="about-title">เรื่องของฉัน</h2>
                    <dl>
                        <div class="detail-row">
                            <dt>ชื่อ-นามสกุล</dt>
                            <dd>นางสาวชุดาภา เจริญสุข</dd>
                        </div>
                        <div class="detail-row">
                            <dt>วันเกิด</dt>
                            <dd>16 พฤษภาคม 2008</dd>
                        </div>
                        <div class="detail-row">
                            <dt>งานอดิเรก</dt>
                            <dd>ฟังเพลง</dd>
                        </div>
                        <div class="detail-row">
                            <dt>สัตว์ที่ชอบ</dt>
                            <dd>สุนัข</dd>
                        </div>
                    </dl>
                </section>

                <p class="little-note"><span aria-hidden="true">♥</span> ค่อย ๆ เติมเรื่องราวในแบบของเรา</p>
            </div>
        </article>
    </main>
</body>
</html>
